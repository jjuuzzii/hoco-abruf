# Basis-Image je Architektur. Ohne diese Datei setzt der Supervisor BUILD_FROM
# nicht, und das Dockerfile (das bewusst keine Vorgabe hat) bräche laut ab statt
# still die falsche Architektur zu ziehen. Dieselben Images wie hofbuch/
# hofrechnung – die Add-ons laufen auf derselben Instanz und teilen die Ebenen.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm-2026.02.0
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm-2026.02.0

labels:
  org.opencontainers.image.title: HOCO-Abruf
  org.opencontainers.image.description: >-
    Fütterungsdaten vom Wasserbauer-HOCO-Rechner: WhatsApp-Bot, Website-Anbindung
    und Hofbüro-Oberfläche für den Aktivstall.
