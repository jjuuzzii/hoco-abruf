# Home-Assistant-Add-on „HOCO-Abruf".
#
# Fütterungsdaten vom Wasserbauer-HOCO-Rechner zu den Einstellern. Das Add-on
# holt den CSV-Vollauszug per FTP vom Fütterungsrechner, rechnet je Pferd
# Raufutter (Minuten) und Kraftfutter (kg) aus und gibt sie weiter:
#
#   * per WhatsApp an den Einsteller (/anmelden mit Freigabe durchs Hofbüro,
#     danach /abruf),
#   * an die Website (WordPress-Plugin „HOCO-Pferdeseiten"),
#   * ins Hofbüro über eine Oberfläche in der Seitenleiste (Ingress).
#
# Eingerichtet wird im Panel des Add-ons: eine Ansicht führt durch alle Werte
# und prüft jede Verbindung einzeln. Hier in Home Assistant gibt es deshalb
# keine Konfiguration mehr.
#
# Seit 0.20.0 kommen die Daten ausschließlich über den FTP-Auszug. Das Abfahren
# des Bedienbildschirms samt Modell-Auslesung ist ausgebaut (siehe STAND.md).
#
# WICHTIG: Wird die Bot-Rufnummer auch privat genutzt, antwortet der Bot nur auf
# echte Befehle (/anmelden, /abruf, /hilfe) und - kurz nach /anmelden - auf die
# Pferd-Antwort. Auf alles andere schweigt er.
name: HOCO-Abruf
version: "0.41.1"
slug: fuetterungsabruf
description: >-
  Fütterungsdaten vom Wasserbauer-HOCO-Rechner: WhatsApp-Bot für die Einsteller (/anmelden mit
  Freigabe durchs Hofbüro, /abruf für die Zahlen), Anbindung der Website, Oberfläche fürs Hofbüro.
url: https://github.com/jjuuzzii/hoco-abruf
arch:
  - aarch64
  - amd64

init: false

# Ingress: kleines Panel in der Seitenleiste (Status, Freigaben, „jetzt abrufen").
ingress: true
ingress_port: 8099
panel_icon: mdi:horse
panel_title: HOCO-Abruf
panel_admin: true

# /share mit Schreibrecht: /share/fuetterungsabruf/pferde.json (Tagesdaten).
# Die dauerhafte Zuordnung Nummer↔Pferd liegt getrennt im privaten /data.
map:
  - share:rw

# Zugriff auf die Home-Assistant-API (WhatsApp empfangen/senden, Freigabe-
# Benachrichtigung). SUPERVISOR_TOKEN stellt der Supervisor bereit.
homeassistant_api: true


# Keine Optionen mehr an dieser Stelle.
#
# Bis 0.40.x standen die Einstellungen hier und kamen als Umgebungsvariablen im
# Add-on an. Das hiess zwei Oberflaechen fuer dieselbe Sache, und jede Aenderung
# brauchte einen Neustart. Seit 0.41.0 fuehrt das Add-on sie selbst
# (/data/konfig.json) und die Ersteinrichtung im Panel schreibt sie - dort
# gelten sie sofort.
#
# Wer von 0.40.x kommt, muss nichts tun: die Werte sind beim ersten Start von
# 0.41.0 automatisch uebernommen worden.

backup: hot
