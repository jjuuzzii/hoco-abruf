# Home-Assistant-Add-on „HOCO-Abruf".
#
# Fütterungsdaten vom Wasserbauer-HOCO-Rechner zu den Einstellern. Das Add-on
# holt den CSV-Vollauszug per FTP vom Fütterungsrechner, rechnet je Pferd
# Raufutter (Minuten) und Kraftfutter (kg) aus und gibt sie weiter:
#
#   * per WhatsApp an den Einsteller (/anmelden mit Freigabe durchs Hofbüro,
#     danach /abruf),
#   * an die Website (WordPress-Plugin „HOCO-Pferdeseiten"),
#   * ins Hofbüro über eine Oberfläche in der Seitenleiste (Ingress).
#
# Beim ersten Start führt eine Ersteinrichtung im Panel durch alle Werte und
# prüft jede Verbindung einzeln. Von Hand ausfüllen muss man hier nichts.
#
# Seit 0.20.0 kommen die Daten ausschließlich über den FTP-Auszug. Das Abfahren
# des Bedienbildschirms samt Modell-Auslesung ist ausgebaut (siehe STAND.md).
#
# WICHTIG: Wird die Bot-Rufnummer auch privat genutzt, antwortet der Bot nur auf
# echte Befehle (/anmelden, /abruf, /hilfe) und - kurz nach /anmelden - auf die
# Pferd-Antwort. Auf alles andere schweigt er.
name: HOCO-Abruf
version: "0.40.0"
slug: fuetterungsabruf
description: >-
  Fütterungsdaten vom Wasserbauer-HOCO-Rechner: WhatsApp-Bot für die Einsteller (/anmelden mit
  Freigabe durchs Hofbüro, /abruf für die Zahlen), Anbindung der Website, Oberfläche fürs Hofbüro.
url: https://github.com/jjuuzzii/hoco-abruf
arch:
  - aarch64
  - amd64

init: false

# Ingress: kleines Panel in der Seitenleiste (Status, Freigaben, „jetzt abrufen").
ingress: true
ingress_port: 8099
panel_icon: mdi:horse
panel_title: HOCO-Abruf
panel_admin: true

# /share mit Schreibrecht: /share/fuetterungsabruf/pferde.json (Tagesdaten).
# Die dauerhafte Zuordnung Nummer↔Pferd liegt getrennt im privaten /data.
map:
  - share:rw

# Zugriff auf die Home-Assistant-API (WhatsApp empfangen/senden, Freigabe-
# Benachrichtigung). SUPERVISOR_TOKEN stellt der Supervisor bereit.
homeassistant_api: true

# Zugriff auf die Supervisor-API. Nur für „addons/self": die Ersteinrichtung
# im Panel schreibt die hier stehenden Optionen selbst, damit man zum
# Einrichten nicht zwischen zwei Oberflächen hin und her springen muss.
hassio_api: true

options:
  # Name des Betriebs. Steht im Kopf der Pferdeseiten, in den
  # WhatsApp-Vorlagen und in der Fußzeile des Panels.
  stall_name: ""
  # FTP des Fütterungsrechners. Nur die Adresse muss ein anderer Betrieb
  # tauschen; leer lassen heißt anonym.
  hoco_host: "172.16.1.49"
  hoco_verzeichnis: "/export"
  hoco_benutzer: ""
  hoco_passwort: ""
  # Aktionierbare Benachrichtigung „bestätigen/ablehnen" an diesen Notify-Dienst.
  # Ab 0.14.0 geht auch die Morgenmeldung (nicht erkannte Tiere) hierhin; Zeit,
  # Wochentage, Umfang und ein abweichender Empfänger stehen im Add-on selbst
  # unter „Fütterungspläne → Morgenmeldung“.
  hofbuero_notify: notify.mobile_app_iphone
  # Wie oft nachgesehen wird, ob der Rechner eine neue Datei geschrieben hat.
  # Er schreibt etwa alle 30 Minuten; 5 Minuten heißt also: die Zahlen sind nie
  # älter als der Schreibabstand plus fünf Minuten. Nachsehen kostet nichts
  # (ein FTP-LIST), gearbeitet wird nur bei einem neuen Dateinamen.
  abruf_takt_minuten: 5
  # Website (WordPress-Plugin): Link-Basis, Push-Endpunkt, geheimer Schluessel.
  # Eigene Domain eintragen, z. B.
  #   website_link: "https://beispielhof.de/fuetterung/?k="
  #   website_api:  "https://beispielhof.de/wp-json/fuetterung/v1"
  # Der Schluessel steht in der wp-config.php des Servers (FUETTERUNG_SECRET)
  # und wird hier im Add-on-UI eingetragen - nicht in dieser Datei.
  website_link: ""
  website_api: ""
  website_secret: ""
  # Abo (Stufe 1): jährlicher Beitrag per PayPal. Kennung = paypal.me/<kennung>,
  # Betrag in EUR wird im Zahl-Link vorausgefüllt. Leer = nur „im Hofbüro".
  paypal_me: ""
  abo_jahrespreis: "12"
  log_stufe: info

schema:
  stall_name: str?
  hoco_host: str?
  hoco_verzeichnis: str?
  hoco_benutzer: str?
  hoco_passwort: password?
  hofbuero_notify: str?
  abruf_takt_minuten: int(1,60)?
  website_link: str?
  website_api: str?
  website_secret: password?
  paypal_me: str?
  abo_jahrespreis: str?
  log_stufe: list(debug|info|warning|error)?

backup: hot
